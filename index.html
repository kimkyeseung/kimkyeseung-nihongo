<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#58cc02" />
    <!-- 매니페스트의 display: standalone / purpose: maskable을 iOS Safari는 무시하고
         이 태그들만 본다 — vite-plugin-pwa가 <link rel="manifest">와 SW 등록은
         빌드 시 자동으로 넣어주지만, apple-* 메타는 손으로 넣어야 한다. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="김계승 일본어" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jua&family=Kosugi+Maru&display=swap"
      rel="stylesheet"
    />
    <title>김계승 일본어</title>
    <!-- 화면 모드를 **첫 페인트 전에** 붙인다 — React가 뜬 뒤에 붙이면 어두운 모드에서 흰 화면이
         한 번 번쩍인다. 판단은 src/lib/theme.ts와 같다(키 `appearance`, zustand persist 모양).
         한쪽을 바꾸면 다른 쪽도 고칠 것. -->
    <script>
      (function () {
        var pref = "system";
        try {
          var saved = JSON.parse(localStorage.getItem("appearance") || "null");
          var t = saved && saved.state && saved.state.theme;
          if (t === "light" || t === "dark") pref = t;
        } catch (e) {}
        var dark = pref === "dark" || (pref === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
